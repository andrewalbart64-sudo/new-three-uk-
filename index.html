<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My3 account</title>

<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    width: 100%;
    max-width: 560px;
  }
  .logo-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 10px;
  }
  .logo-wrap svg {
    width: 130px;
    height: 130px;
    fill: #000;
  }
  h1 {
    text-align: center;
    font-size: 42px;
    font-weight: 800;
    margin: 0 0 30px;
  }
  .tabs {
    display: flex;
    border-bottom: 1px solid #ccc;
    margin-bottom: 40px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding-bottom: 14px;
    font-size: 20px;
    color: #888;
    cursor: default;
  }
  .tab.active {
    color: #111;
    font-weight: 700;
    border-bottom: 3px solid #111;
    margin-bottom: -1px;
  }
  .field {
    margin-bottom: 34px;
  }
  label {
    display: block;
    font-size: 20px;
    font-weight: 700;
    color: #555;
    margin-bottom: 10px;
  }
  label .req {
    color: #555;
  }
  .input-wrap {
    position: relative;
  }
  input {
    width: 100%;
    border: none;
    border-bottom: 1px solid #333;
    padding: 10px 30px 10px 2px;
    font-size: 16px;
    outline: none;
  }
  input:focus {
    border-bottom: 2px solid #000;
  }
  input.error {
    border-bottom: 2px solid #c0392b;
  }
  a.link {
    color: #1a5fd0;
    text-decoration: underline;
    font-size: 16px;
  }
  button.submit {
    width: 100%;
    background: #000;
    color: #f7c9c9;
    border: none;
    border-radius: 30px;
    padding: 16px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 20px;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s ease;
  }
  button.submit:hover {
    opacity: 0.9;
  }
  button.submit:active {
    opacity: 0.8;
  }
  button.submit:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .status {
    text-align: center;
    font-size: 15px;
    margin-bottom: 20px;
    min-height: 20px;
  }
  .status.success { color: #1a7f37; }
  .status.error { color: #c0392b; }
  .disclaimer {
    font-size: 15px;
    color: #222;
    line-height: 1.5;
    margin-bottom: 30px;
  }
  hr {
    border: none;
    border-top: 2px solid #000;
    margin-bottom: 20px;
  }

  @media (max-width: 480px) {
    body { padding: 24px 16px; }
    .logo-wrap svg { width: 90px; height: 90px; }
    h1 { font-size: 30px; margin-bottom: 22px; }
    .tabs { margin-bottom: 28px; }
    .tab { font-size: 17px; padding-bottom: 10px; }
    .field { margin-bottom: 26px; }
    label { font-size: 17px; margin-bottom: 8px; }
    input { font-size: 16px; padding: 12px 30px 12px 2px; }
    button.submit { font-size: 18px; padding: 15px; }
    .disclaimer { font-size: 14px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <svg id="three_logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
        <title>Three</title>

          </g>
        </g>
      </svg>
    </div>
    <h1>My3 account</h1>

    <div class="tabs">
      <div class="tab active">Subscribe</div>
      <div class="tab">Register</div>
    </div>

    <form id="subscribeForm">
      <div class="field">
        <label for="email">Email address<span class="req">*</span></label>
        <div class="input-wrap">
          <input id="email" type="email" name="user_email" required>
        </div>
      </div>

      <div class="field">
        <label for="name">Name<span class="req">*</span></label>
        <div class="input-wrap">
          <input id="name" type="text" name="user_name" required>
        </div>
      </div>

      <button type="submit" class="submit" id="submitBtn">Subscribe</button>
      <div class="status" id="statusMsg"></div>
    </form>

    <div class="disclaimer">
      Three uses hCAPTCHA to keep our forms and users safe from fraud. hCAPTCHA may collect some personal or analytical data. To learn more please visit:
      <a href="#" class="link">Privacy policy</a> and
      <a href="#" class="link">hCAPTCHA</a> website.
    </div>

    <hr>

    <a href="#" class="link">&lt; Back to home</a>
  </div>

<script>
  // ----------------------------------------------------------------
  // EmailJS setup — replace these three values with your own from
  // https://dashboard.emailjs.com
  // ----------------------------------------------------------------
  const EMAILJS_PUBLIC_KEY  = "o0q_ACfJvwVr2rV6w";  // Account > General
  const EMAILJS_SERVICE_ID  = "service_xkve0q9";    // Gmail
  const EMAILJS_TEMPLATE_ID = "template_vkdxram";  // Contact Us

  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

  const form = document.getElementById("subscribeForm");
  const submitBtn = document.getElementById("submitBtn");
  const statusMsg = document.getElementById("statusMsg");

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    statusMsg.textContent = "";
    statusMsg.className = "status";
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    emailjs.sendForm(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, form)
      .then(function () {
        statusMsg.textContent = "You're subscribed! Check your inbox.";
        statusMsg.className = "status success";
        form.reset();
      })
      .catch(function (err) {
        statusMsg.textContent = "Something went wrong. Please try again.";
        statusMsg.className = "status error";
        console.error("EmailJS error:", err);
      })
      .finally(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = "Subscribe";
      });
  });
</script>
</body>
</html>
